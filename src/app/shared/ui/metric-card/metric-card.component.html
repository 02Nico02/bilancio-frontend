<article class="metric-card metric-card--{{ tone }}">
  <p class="metric-card__label">{{ label }}</p>
  <p class="metric-card__value mono">{{ value }}</p>
  @if (caption) {
    <p class="metric-card__caption">{{ caption }}</p>
  }
  @if (trend) {
    <p class="metric-card__trend">
      <span class="metric-card__tone">{{ toneLabel ?? 'Neutro' }}</span>
      <span>{{ trend }}</span>
    </p>
  }
</article>
