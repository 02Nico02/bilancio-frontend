<div class="shell">
  <button
    class="shell__backdrop"
    type="button"
    [class.shell__backdrop--visible]="sidebarOpen()"
    aria-label="Cerrar navegación"
    [attr.aria-hidden]="!sidebarOpen()"
    [attr.tabindex]="sidebarOpen() ? 0 : -1"
    (click)="closeSidebar()"
  ></button>

  <aside class="shell__sidebar" [class.shell__sidebar--open]="sidebarOpen()">
    <div class="brand">
      <a class="brand__link" routerLink="/dashboard" (click)="closeOnNavigate()">
        <img class="brand__logo" src="/logo-bilancio.png" alt="Bilancio" />
        <span class="sr-only">Bilancio</span>
      </a>
    </div>

    <nav class="nav" aria-label="Navegación principal">
      <div class="nav__group">
        @for (item of primaryNav; track item.path) {
          <a
            class="nav__item"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
            (click)="closeOnNavigate()"
          >
            <app-icon class="nav__icon" [name]="item.icon" />
            <span class="nav__label">{{ item.label }}</span>
          </a>
        }
      </div>

      <div class="nav__group nav__group--future" aria-label="Próximamente">
        @for (item of futureNav; track item.label) {
          <button class="nav__item nav__item--disabled" type="button" disabled>
            <app-icon class="nav__icon nav__icon--future" [name]="item.icon" />
            <span class="nav__label">
              {{ item.label }}
              <small>{{ item.note }}</small>
            </span>
          </button>
        }
      </div>
    </nav>

    <div class="shell__footer">
      <button class="cta-button" type="button" disabled>
        <span class="cta-button__icon-wrap">
          <app-icon class="cta-button__icon" name="plus" />
        </span>
        <span class="cta-button__copy">
          <span class="cta-button__label">Registrar movimiento</span>
          <span class="cta-button__subtle">Ingreso, gasto o transferencia</span>
        </span>
      </button>

      <div class="utility-links" aria-label="Acciones secundarias">
        @for (item of utilityNav; track item.label) {
          <button class="utility-links__item" type="button" disabled>
            <app-icon class="nav__icon nav__icon--utility" [name]="item.icon" />
            <span>{{ item.label }}</span>
          </button>
        }
      </div>
    </div>
  </aside>

  <div class="shell__content">
    <header class="topbar">
      <div class="topbar__leading">
        <button
          class="topbar__menu"
          type="button"
          aria-label="Abrir navegación"
          [attr.aria-expanded]="sidebarOpen()"
          (click)="toggleSidebar()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <button class="topbar__period" type="button" aria-label="Seleccionar período">
          <app-icon name="calendar" />
          <span>{{ selectedPeriodLabel }}</span>
          <app-icon name="chevron-down" />
        </button>
      </div>

      <div class="topbar__actions" aria-label="Acciones de navegación">
        <button class="topbar__action topbar__action--notification" type="button" aria-label="Notificaciones">
          <app-icon name="notifications" />
          <span class="topbar__badge">1</span>
        </button>
        <button class="topbar__action" type="button" aria-label="Configuración">
          <app-icon name="settings" />
        </button>
        <button class="topbar__profile" type="button" aria-label="Perfil">
          <app-icon name="profile" />
        </button>
      </div>
    </header>

    <main class="shell__main">
      <router-outlet />
    </main>
  </div>
</div>
